{% extends "base.html" %}
{% block content %}

<div class="min-h-screen bg-[#050505] flex items-center justify-center relative overflow-hidden p-4">
    
    <div class="absolute w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-[150px] -top-20 -left-20 animate-pulse"></div>
    <div class="absolute w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[150px] bottom-0 right-0 animate-pulse delay-1000"></div>

    <div class="relative z-10 w-full max-w-md bg-white/5 backdrop-blur-2xl border border-white/10 p-8 md:p-10 rounded-3xl shadow-2xl">
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-white tracking-tight">Login</h2>
            <p class="text-slate-400 mt-2 text-sm">Sign in to your private workspace</p>
        </div>

        <form onsubmit="login(event)">
            {% csrf_token %}

            <div>
                <input name="email" type="email" placeholder="Email address"
                    class="w-full bg-white/5 border border-white/10 text-white px-4 py-4 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-500"
                    required>
            </div>

            <div>
                <input name="password" type="password" placeholder="Password"
                    class="w-full bg-white/5 border border-white/10 text-white px-4 py-4 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-500"
                    required>
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-4 rounded-xl font-bold hover:scale-[1.02] transition-transform duration-300 shadow-xl shadow-indigo-500/20">
                Secure Login →
            </button>
        </form>

        {% if error %}
            <p class="text-red-400 mt-4 text-center text-sm font-medium">{{ error }}</p>
        {% endif %}

        <p class="text-center mt-8 text-slate-500 text-sm">
            Don’t have access? 
            <a href="/signup/" class="text-indigo-400 font-semibold hover:underline">Request Invite</a>
        </p>
    </div>

</div>

{% endblock %}
